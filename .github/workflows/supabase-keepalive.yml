name: Supabase Keep-Alive

# Free-tier Supabase projects are paused after ~7 days without activity.
# This pings each project with a real REST query (which hits Postgres) every
# 3 days so none of them go idle. Projects whose URL secret/var is unset are
# skipped, so slots can be filled in as needed.

on:
  schedule:
    - cron: "17 6 */3 * *" # 06:17 UTC every 3rd day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # WabWay (main project) — reuses the same var/secret as build-and-deploy.yml
          - name: wabway
            url_ref: SUPABASE_URL
            key_ref: SUPABASE_ANON_KEY
            # profiles' SELECT policy doesn't call is_trip_member(), which anon
            # can't execute (migration 043) — so anon gets [] instead of 401.
            table: profiles
          - name: project-2
            url_ref: KEEPALIVE_2_URL
            key_ref: KEEPALIVE_2_KEY
            table_ref: KEEPALIVE_2_TABLE
          - name: project-3
            url_ref: KEEPALIVE_3_URL
            key_ref: KEEPALIVE_3_KEY
            table_ref: KEEPALIVE_3_TABLE

    steps:
      - name: Ping ${{ matrix.name }}
        env:
          URL: ${{ vars[matrix.url_ref] || secrets[matrix.url_ref] }}
          KEY: ${{ secrets[matrix.key_ref] }}
          TABLE: ${{ matrix.table || vars[matrix.table_ref] }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ -z "$TABLE" ]; then
            echo "::notice::${{ matrix.name }} not configured — skipping"
            exit 0
          fi
          # A table select goes through PostgREST into Postgres, which counts
          # as activity. RLS may return [] for anon — that's fine, the query
          # still runs.
          status=$(curl -s -o /tmp/body -w '%{http_code}' \
            "${URL%/}/rest/v1/${TABLE}?select=*&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          echo "HTTP $status"
          head -c 300 /tmp/body; echo
          if [ "$status" -ge 400 ]; then
            echo "::error::${{ matrix.name }} ping failed (HTTP $status) — project may already be paused"
            exit 1
          fi
