name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build Android APK and release?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  # ── Web → GitHub Pages ────────────────────────────────────────────────────────
  # Runs independently of the APK job (no Java needed for web builds).
  build-web:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ vars.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "AUDIO_SERVER_URL=${{ vars.AUDIO_SERVER_URL }}" >> .env
          echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}" >> .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Extract build number
        id: version
        run: echo "build=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build web
        run: flutter build web --build-number=${{ steps.version.outputs.build }} --dart-define-from-file=.env

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

  # ── Android APK ───────────────────────────────────────────────────────────────
  # Runs in parallel with build-web. Only executes on push or when manually
  # triggered with build_apk=true.
  build-apk:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.build_apk == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ vars.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "AUDIO_SERVER_URL=${{ vars.AUDIO_SERVER_URL }}" >> .env
          echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}" >> .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          BASE=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD=${{ github.run_number }}
          echo "full=${BASE}+${BUILD}" >> $GITHUB_OUTPUT
          echo "tag=v${BASE}+${BUILD}" >> $GITHUB_OUTPUT
          echo "name=WabWay v${BASE}" >> $GITHUB_OUTPUT
          echo "build=${BUILD}" >> $GITHUB_OUTPUT

      - name: Set up signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/wabway-release.jks
          cat > android/key.properties <<EOF
          storeFile=wabway-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ steps.version.outputs.build }} --dart-define-from-file=.env

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/wabway-${{ steps.version.outputs.tag }}.apk

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            Install on Android: download the APK below, tap it, and follow the prompts.
            Enable "Install from unknown sources" if prompted.
          files: build/app/outputs/flutter-apk/wabway-${{ steps.version.outputs.tag }}.apk
          make_latest: true
